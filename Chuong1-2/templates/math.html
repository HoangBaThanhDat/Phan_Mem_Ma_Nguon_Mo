<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Toán Cơ Bản (Phương thức GET)</title>
    <!-- Nhúng thư viện giao diện Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', sans-serif; }
        .glass-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            border: none;
        }
        .math-result {
            font-size: 1.25rem;
            font-weight: 500;
            letter-spacing: 1px;
            background-color: #f8f9fa;
        }
        .operator { color: #6c757d; font-weight: bold; margin: 0 10px; }
        .equals { color: #0d6efd; font-weight: bold; margin: 0 10px; }
        .answer { color: #198754; font-weight: bold; font-size: 1.4rem; }
    </style>
</head>
<body class="d-flex align-items-center min-vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card glass-card">
                    <div class="card-header bg-dark text-white text-center py-3" style="border-radius: 15px 15px 0 0;">
                        <h5 class="mb-0 fw-bold">Tính Toán 4 Phép Tính</h5>
                    </div>
                    <div class="card-body p-4">
                        
                        <!-- Form bắt buộc dùng method="GET" theo logic của thầy -->
                        <form method="GET" action="/">
                            <div class="row g-3 mb-4">
                                <div class="col-6">
                                    <label for="a" class="form-label text-muted fw-bold">Nhập số a:</label>
                                    <input type="number" step="any" class="form-control form-control-lg" name="a" id="a" value="{{ a }}" autofocus>
                                </div>
                                <div class="col-6">
                                    <label for="b" class="form-label text-muted fw-bold">Nhập số b:</label>
                                    <!-- Hiển thị mặc định b = 1 theo logic app.py khi mới mở trang -->
                                    <input type="number" step="any" class="form-control form-control-lg" name="b" id="b" value="{{ b }}">
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 fw-bold py-2 fs-5">Xác nhận (GET)</button>
                        </form>

                        <hr class="my-4 text-muted">

                        <!-- Danh sách hiển thị đúng định dạng: a + b = kết quả -->
                        <h6 class="text-muted fw-bold mb-3 text-uppercase" style="font-size: 0.85rem;">Kết quả chi tiết:</h6>
                        <ul class="list-group list-group-flush shadow-sm border rounded">
                            <li class="list-group-item math-result py-3 d-flex justify-content-between align-items-center">
                                <div>{{ a }} <span class="operator">+</span> {{ b }} <span class="equals">=</span></div>
                                <span class="answer text-primary">{{ cong }}</span>
                            </li>
                            <li class="list-group-item math-result py-3 d-flex justify-content-between align-items-center">
                                <div>{{ a }} <span class="operator">-</span> {{ b }} <span class="equals">=</span></div>
                                <span class="answer text-danger">{{ tru }}</span>
                            </li>
                            <li class="list-group-item math-result py-3 d-flex justify-content-between align-items-center">
                                <div>{{ a }} <span class="operator">×</span> {{ b }} <span class="equals">=</span></div>
                                <span class="answer text-success">{{ nhan }}</span>
                            </li>
                            <li class="list-group-item math-result py-3 d-flex justify-content-between align-items-center">
                                <div>{{ a }} <span class="operator">÷</span> {{ b }} <span class="equals">=</span></div>
                                <span class="answer text-warning text-dark">{{ chia }}</span>
                            </li>
                        </ul>
                        
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>

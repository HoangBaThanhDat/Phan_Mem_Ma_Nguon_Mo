<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Trang Chủ{% endblock %} - {{ shop.name }}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --brand-green: #1b3b2b;
            --brand-cream: #f7f4ec;
        }
        html, body {
            height: 100vh;
            overflow-x: hidden;
            background-color: var(--brand-cream);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .main-wrapper {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            max-width: 1140px;
            margin: 0 auto;
            padding: 12px 15px;
        }
        .navbar-custom {
            background-color: var(--brand-green) !important;
            border-radius: 0.75rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
            padding: 0.6rem 1.2rem;
        }
        .nav-link {
            color: rgba(255, 255, 255, 0.85) !important;
            font-weight: 500;
            border-radius: 0.5rem;
            transition: all 0.25s ease;
        }
        .nav-link:hover, .nav-link.active {
            color: #ffffff !important;
            background-color: rgba(255, 255, 255, 0.12);
        }
    </style>
    {% block styles %}{% endblock %}
</head>
<body>

    <div class="main-wrapper">
        <!-- Menu 3 liên kết -->
        <nav class="navbar navbar-expand-lg navbar-dark navbar-custom shadow-sm mb-3">
            <a class="navbar-brand fw-bold" href="/">
                <i class="fa-solid fa-mug-hot text-warning me-2"></i>{{ shop.name }}
            </a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto gap-1">
                    <li class="nav-item"><a class="nav-link" href="/">Trang chủ</a></li>
                    <li class="nav-item"><a class="nav-link" href="/menu">Thực đơn</a></li>
                    <li class="nav-item"><a class="nav-link" href="/contact">Liên hệ</a></li>
                </ul>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="my-auto">
            {% block content %}{% endblock %}
        </main>

        <!-- Chân trang có hiển thị giờ mở cửa -->
        <footer class="text-center py-2.5 mt-3 bg-white rounded-3 shadow-sm text-muted" style="font-size: 0.78rem;">
            &copy; 2026 <strong>{{ shop.name }}</strong> | Địa chỉ: {{ shop.address }} | Giờ mở cửa: <span class="text-dark fw-bold">{{ shop.open }}:00 - {{ shop.close }}:00</span> | Hotline: <span class="text-success fw-bold">{{ shop.phone }}</span>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
